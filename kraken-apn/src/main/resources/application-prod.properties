# ===========================================
# Production Profile for Kraken APN Gateway
# ===========================================
server.port=8081

logging.level.root=WARN
logging.level.com.example.kraken_apn=INFO

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Production datasource (driven by environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Production APN API configs (can be overridden by environment variables)
apn.api.url=${APN_API_URL:http://10.55.245.100/api/dmc/send-apn}
apn.api.key=${APN_API_KEY:AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe}
apn.api.connect-timeout-ms=${APN_CONNECT_TIMEOUT_MS:3000}
apn.api.read-timeout-ms=${APN_READ_TIMEOUT_MS:30000}
apn.api.max-connections=${APN_MAX_CONNECTIONS:150}
apn.api.rate-limit-tps=${APN_RATE_LIMIT_TPS:60}
apn.api.rate-limit-timeout-ms=${APN_RATE_LIMIT_TIMEOUT_MS:200}
apn.api.max-concurrent-calls=${APN_MAX_CONCURRENT_CALLS:150}
