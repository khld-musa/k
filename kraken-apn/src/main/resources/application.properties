# ===========================================
# Kraken APN Gateway Configuration
# ===========================================
spring.application.name=kraken-apn
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8081}

# Embedded Tomcat Tuning for High Throughput & Fast Fail
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=35s

# ===========================================
# Database Configuration (PostgreSQL)
# ===========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kraken_db?rewriteBatchedStatements=true}
spring.datasource.username=${DB_USER:kraken}
spring.datasource.password=${DB_PASSWORD:kraken}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated HikariCP pool for APN logging
spring.datasource.hikari.pool-name=KrakenApnHikariPool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA - Table already exists, do not auto-modify
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# APN External API Configuration
# ===========================================
apn.api.url=${APN_API_URL:http://10.55.245.100/api/dmc/send-apn}
apn.api.key=${APN_API_KEY:AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe}
apn.api.connect-timeout-ms=${APN_CONNECT_TIMEOUT_MS:3000}
apn.api.read-timeout-ms=${APN_READ_TIMEOUT_MS:30000}
apn.api.max-connections=${APN_MAX_CONNECTIONS:150}
apn.api.rate-limit-tps=${APN_RATE_LIMIT_TPS:60}
apn.api.rate-limit-timeout-ms=${APN_RATE_LIMIT_TIMEOUT_MS:200}
apn.api.max-concurrent-calls=${APN_MAX_CONCURRENT_CALLS:150}

# ===========================================
# Actuator / Health Checks
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.example.kraken_apn=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
