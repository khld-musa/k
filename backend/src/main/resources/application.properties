# ===========================================
# USSD Gateway Application Configuration
# ===========================================
spring.application.name=kraken
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8080
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000
# Live trace SSE streams run up to 30 min; the servlet default (30s) would cut them off
spring.mvc.async.request-timeout=35m

# ===========================================
# Database Configuration (PostgreSQL)
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/kraken_db?rewriteBatchedStatements=true
spring.datasource.username=kraken
spring.datasource.password=kraken
spring.datasource.driver-class-name=org.postgresql.Driver
# ── HikariCP connection pool ──
# 25 connections: enough headroom for concurrent reports, ingestion, FTP and login
# without overwhelming PostgreSQL's default max_connections (100).
# Budget: 4 (reportQuery) + 4 (reportExport) + 5 (scheduler) + 5 (apnLog) + 7 (web/misc) = 25
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ── JDBC batching: groups INSERTs/UPDATEs into fewer round-trips (critical for log ingestion) ──
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# ===========================================
# Redis Configuration
# ===========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# ===========================================
# Security Configuration
# ===========================================
# IMPORTANT: Set these via environment variables in production!
# JWT_SECRET must be at least 32 characters.
# ENCRYPTION_SECRET must be a strong passphrase.
jwt.secret=${JWT_SECRET:dev-only-secret-key-min-32-chars-long!!}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===========================================
# Encryption (for SSH passwords/keys)
# ===========================================
# The fallback below is used ONLY for local development (when ENCRYPTION_SECRET is not set).
# In production/staging, ENCRYPTION_SECRET MUST be overridden via environment variable.
encryption.secret=${ENCRYPTION_SECRET:95243a172083bb4e533c2fccaa8233ed0fac3b02b0b2ea7be4783756a0262b57}
encryption.salt=${ENCRYPTION_SALT:}

# ===========================================
# Admin Seeding
# ===========================================
admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# ===========================================
# USSD Log Configuration
# ===========================================
# Local USSD log directories are located under /mediation/{server_name}/ (e.g. /mediation/SUB1, /mediation/SUB2, /mediation/SUB3)
ussd.log.base-path=${USSD_LOG_BASE_PATH:/mediation}
ussd.log.file-pattern=TIBCO-%s.log

# Periodic 15-minute log ingestion from /mediation/{server_name}
ussd.ingestion.enabled=${USSD_INGESTION_ENABLED:true}
ussd.ingestion.cron=${USSD_INGESTION_CRON:0 */15 * * * *}
ussd.ingestion.delete-after-ingest=${USSD_INGESTION_DELETE_AFTER:true}

# FTP log fetch worker (temporarily disabled; set USSD_FTP_ENABLED=true to re-enable)
ussd.ftp.enabled=${USSD_FTP_ENABLED:false}
ussd.log.fetch-cron=${USSD_LOG_FETCH_CRON:-}

# ===========================================
# FTP Configuration (remote log file pickup)
# ===========================================
ussd.ftp.connect-timeout-ms=${USSD_FTP_CONNECT_TIMEOUT_MS:10000}
ussd.ftp.read-timeout-ms=${USSD_FTP_READ_TIMEOUT_MS:30000}
ussd.ftp.delete-after-pull=${USSD_FTP_DELETE_AFTER_PULL:true}

# ===========================================
# SSH Configuration
# ===========================================
# Host key checking: "no" (dev default), "yes" (production), or "ask"
# In production, set SSH_STRICT_HOST_KEY_CHECKING=yes and provide
# SSH_KNOWN_HOSTS_FILE pointing to a trusted known_hosts file.
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:no}
ssh.known-hosts-file=${SSH_KNOWN_HOSTS_FILE:}

# ===========================================
# CORS / WebSocket Allowed Origins (comma-separated)
# ===========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

# ===========================================
# Actuator / Monitoring
# ===========================================
management.endpoints.web.exposure.include=health,info

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.example.ussdGateway=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
# ===========================================
# Sesme API Configuration
# ===========================================
# Default production URL. Override with SESME_API_URL env var or system property.
sesme.api.url=${SESME_API_URL:http://localhost:5000/v1/balance}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ===========================================
# Resilience4j / Circuit Breaker
# ===========================================
resilience4j.circuitbreaker.instances.sesmeApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.sesmeApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.sesmeApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.sesmeApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.sesmeApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.sesmeApi.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.sesmeApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.sesmeApi.eventConsumerBufferSize=10

# [FIX P1-6] Retry — retries transient failures before the circuit breaker trips
resilience4j.retry.instances.sesmeApi.maxAttempts=3
resilience4j.retry.instances.sesmeApi.waitDuration=2s
resilience4j.retry.instances.sesmeApi.enableExponentialBackoff=true
resilience4j.retry.instances.sesmeApi.exponentialBackoffMultiplier=2

# USSD Proxy - Circuit Breaker
resilience4j.circuitbreaker.instances.ussdProxy.slidingWindowSize=20
resilience4j.circuitbreaker.instances.ussdProxy.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ussdProxy.waitDurationInOpenState=10s

# USSD Proxy - Retry
resilience4j.retry.instances.ussdProxy.maxAttempts=2
resilience4j.retry.instances.ussdProxy.waitDuration=1s

# USSD Proxy - WebClient Pool
ussd-proxy.webclient.max-connections=200
ussd-proxy.webclient.pending-acquire-max-count=500

# ===========================================
# APN External API Configuration
# ===========================================
apn.api.url=${APN_API_URL:http://10.55.245.100/api/dmc/send-apn}
apn.api.key=${APN_API_KEY:AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe}
apn.api.connect-timeout-ms=${APN_CONNECT_TIMEOUT_MS:2000}
apn.api.read-timeout-ms=${APN_READ_TIMEOUT_MS:9000}
apn.api.max-connections=${APN_MAX_CONNECTIONS:50}
apn.api.rate-limit-tps=${APN_RATE_LIMIT_TPS:18}
apn.api.rate-limit-timeout-ms=${APN_RATE_LIMIT_TIMEOUT_MS:100}

# APN Circuit Breaker
resilience4j.circuitbreaker.instances.apnApi.slidingWindowSize=50
resilience4j.circuitbreaker.instances.apnApi.failureRateThreshold=80
resilience4j.circuitbreaker.instances.apnApi.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.apnApi.permittedNumberOfCallsInHalfOpenState=3

# ===========================================
# Report Background Export Settings
# ===========================================
app.export.dir=${APP_EXPORT_DIR:/var/log/ussd/exports}
app.export.ttl-hours=${APP_EXPORT_TTL_HOURS:24}

# ===========================================
# USSD Data Retention & Storage Cleanup
# ===========================================
# Keep transaction data for N days (default 30). Prevents unbounded 47GB+ disk bloat.
ussd.retention.days=${USSD_RETENTION_DAYS:30}
ussd.retention.batch-size=${USSD_RETENTION_BATCH_SIZE:10000}
ussd.retention.cron=${USSD_RETENTION_CRON:0 0 2 * * *}



