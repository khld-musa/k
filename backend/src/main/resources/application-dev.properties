# Application configuration for DEVELOPMENT profile
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.ussdGateway=DEBUG
logging.level.org.springframework.web=INFO

# Database - PostgreSQL (Local container)
spring.datasource.url=jdbc:postgresql://localhost:5432/kraken_db
spring.datasource.username=${DB_USER:kraken}
spring.datasource.password=${DB_PASSWORD:kraken}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (Local container)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT settings
app.jwt.secret=${JWT_SECRET:8a4b6c9d2f1e3a5bd8c7e4f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9}
app.jwt.expirationMs=3600000
app.jwt.refreshExpirationMs=86400000

# CORS settings
app.cors.allowed-origins=http://localhost:3000

# Optional configuration file path (if any custom external configs are used locally)
app.log.base-path=logs

# SSH Settings (Lenient for development)
ssh.strict-host-key-checking=no
ssh.known-hosts-file=
