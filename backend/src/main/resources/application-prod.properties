# Application configuration for PRODUCTION profile
server.port=8080
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

# Logging
logging.level.root=WARN
logging.level.com.example.ussdGateway=INFO
logging.level.org.flywaydb=INFO
# Avoid logging SQL in production
spring.jpa.show-sql=false

# Database - PostgreSQL (Production instances or Docker Compose services)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# IMPORTANT: Never use 'update' or 'create' in production! Use Flyway/Liquibase or 'validate'
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# Redis (Production instances)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT settings - MUST BE PROVIDED VIA ENVIRONMENT VARIABLES
# NOTE: The Java code reads 'jwt.secret' (not 'app.jwt.secret')
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:86400000}

# CORS settings - Only allow the production frontend URL
app.cors.allowed-origins=${FRONTEND_URL}

# WebSocket allowed origins - must match the frontend URL
app.ws.allowed-origins=${FRONTEND_URL}

# USSD Log Configuration - Reading from /mediation/{server_name}
ussd.log.base-path=${USSD_LOG_BASE_PATH:/mediation}
ussd.ingestion.enabled=${USSD_INGESTION_ENABLED:true}
ussd.ingestion.cron=${USSD_INGESTION_CRON:0 */15 * * * *}
ussd.ingestion.delete-after-ingest=${USSD_INGESTION_DELETE_AFTER:true}

# FTP log fetch worker (temporarily disabled; set USSD_FTP_ENABLED=true to re-enable)
ussd.ftp.enabled=${USSD_FTP_ENABLED:false}
ussd.log.fetch-cron=${USSD_LOG_FETCH_CRON:-}


# SSH Settings - Strict for Production
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:accept-new}
ssh.known-hosts-file=${SSH_KNOWN_HOSTS_FILE:/home/kraken/.ssh/known_hosts}

# Spring Actuator Endpoints - Exposed for Prometheus/Health checks (Auth protected elsewhere)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# APN External API Configuration
apn.api.url=${APN_API_URL:http://10.55.245.100/api/dmc/send-apn}
apn.api.key=${APN_API_KEY:AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe}
apn.api.connect-timeout-ms=${APN_CONNECT_TIMEOUT_MS:2000}
apn.api.read-timeout-ms=${APN_READ_TIMEOUT_MS:9000}
apn.api.max-connections=${APN_MAX_CONNECTIONS:50}
apn.api.rate-limit-tps=${APN_RATE_LIMIT_TPS:18}
apn.api.rate-limit-timeout-ms=${APN_RATE_LIMIT_TIMEOUT_MS:100}

# APN Circuit Breaker
resilience4j.circuitbreaker.instances.apnApi.slidingWindowSize=50
resilience4j.circuitbreaker.instances.apnApi.failureRateThreshold=80
resilience4j.circuitbreaker.instances.apnApi.permittedNumberOfCallsInHalfOpenState=3

# Report Background Export Settings
app.export.dir=${APP_EXPORT_DIR:/var/log/ussd/exports}
app.export.ttl-hours=${APP_EXPORT_TTL_HOURS:24}

# USSD Data Retention & Storage Cleanup
ussd.retention.days=${USSD_RETENTION_DAYS:30}
ussd.retention.batch-size=${USSD_RETENTION_BATCH_SIZE:10000}
ussd.retention.cron=${USSD_RETENTION_CRON:0 0 2 * * *}


