# Application configuration for TEST profile
spring.application.name=ussd-gateway-test

# Database - H2 In-Memory
spring.datasource.url=jdbc:h2:mem:kraken_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for tests since we use H2 create-drop
spring.flyway.enabled=false

# Redis (disabled for tests)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.data.redis.repositories.enabled=false

# JWT settings
app.jwt.secret=test-only-secret-key-must-be-very-long-32-bytes!!
app.jwt.expirationMs=3600000
app.jwt.refreshExpirationMs=86400000

# CORS settings
app.cors.allowed-origins=http://localhost:3000

# SSH Settings
ssh.strict-host-key-checking=no
ssh.known-hosts-file=

# Rollup tables are PostgreSQL-specific
app.reports.rollup.enabled=false
